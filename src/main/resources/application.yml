spring:
  config:
    import: optional:file:.env[.properties]
  data:
    mongodb:
      uri: mongodb+srv://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@${MONGO_HOST}/${MONGO_DB_NAME}?retryWrites=true&w=majority
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD}
    lettuce:
      pool:
        max-active: 8       # 최대 연결 수
        max-idle: 8         # 최대 대기 연결 수
        min-idle: 0         # 최소 대기 연결 수
    session:
      store-type: redis
      redis:
        namespace: cubeTalk:session   # 세션 저장소 네임스페이스
        flush-mode: immediate # 세션 변경 시 즉시 반영
        timeout: 1800s

management:
  endpoint:
    prometheus:
      enabled: true
  endpoints:
    web:
      exposure:
        include: prometheus

springdoc:
  swagger-ui:
    groups-order: DESC
    tags-sorter: alpha
    operations-sorter: method
    disable-swagger-default-url: true
    display-request-duration: true
    defaultModelsExpandDepth: 2
    defaultModelExpandDepth: 2
  api-docs:
    path: /api-docs
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  writer-with-default-pretty-printer: true
  model-and-view-allowed: true
server:
  servlet:
    session:
      timeout: 30s  # 세션 타임아웃 설정 (30초)


